# VMware Tools: сценарии при паузе и пробуждении ВМ выключены (то же, что vmware-toolbox-cmd script suspend|resume
# disable). Штатный сценарий сети при паузе стирает адреса всех интерфейсов, в том числе сетей Docker, а при
# пробуждении возвращает адрес только основному адаптеру: приложение после паузы перестало бы отвечать.
[powerops]
suspend-script=
resume-script=
