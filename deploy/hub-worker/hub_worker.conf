# Исполнитель записи в AppSec.Hub для «Локального триажа». Этот файл лежит рядом с hub_worker.py.
# Заполните четыре строки, сохраните и запустите hub_worker.cmd. Пароль Hub исполнитель спросит при запуске
# (ввод скрыт) и нигде не сохранит.

# Адрес приложения так, как он открывается в браузере на этой машине:
#   в виртуальной машине – адрес компьютера с приложением, например http://192.168.0.10:8765
#   на том же компьютере, где запущено приложение, – http://127.0.0.1:8765
app_url = http://127.0.0.1:8765

# Адрес Hub – тот же, что в «Настройках» приложения (раздел «AppSec.Hub»), только https, без пути
hub_url = https://hub.example.org

# Ваш логин в Hub
login =

# Ключ исполнителя из «Настроек» приложения, раздел «AppSec.Hub», кнопка «Скопировать ключ»
key = ВСТАВЬТЕ_КЛЮЧ_ИЗ_НАСТРОЕК

# Имя исполнителя в «Настройках» приложения (необязательно; по умолчанию – имя компьютера)
# worker_id = vm-1
