# Зависимости образа с контрольными суммами: те же версии, что в requirements.txt, и хеши колёс для Linux x86-64
# и Python 3.12 (базовый образ в Dockerfile). Dockerfile ставит их с --require-hashes: подменённый в индексе или
# на зеркале пакет не установится. colorama нужна только в Windows и сюда не входит.
#
# После смены версий в requirements.txt хеши пересчитываются в том же базовом образе:
#   docker run --rm -v "${PWD}:/w" <образ из Dockerfile> sh -c "pip download --no-deps --only-binary=:all: -r /w/requirements.txt -d /tmp/w && sha256sum /tmp/w/*"
