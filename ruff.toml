# Целевой lint (бэклог п. 24, аудит Kimi 25.10, KIMI-10): небольшой обязательный набор правил, которые ловят дефекты
# без запуска кода – синтаксис и неразрешимые имена (E9, F63, F7, F82), неиспользуемые импорты и переменные (F401,
# F841), повторные определения (F811 – в app/; в тестах это фикстуры), сравнения с None/True/False (E711–E714),
# ошибки pylint (PLE), ловушки bugbear (B – пока только в app/).
# Остальной долг (стиль, порядок импортов, F811 у фикстур в тестах) сокращается отдельными коммитами, не массовым
# автоисправлением. Прогон: `.venv\Scripts\python -m ruff check app tests scripts`; вместе с тестами –
# tests/test_lint.py.
line-length = 120
target-version = "py312"

[lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841", "E711", "E712", "E713", "E714", "PLE", "B"]

[lint.per-file-ignores]
"tests/**" = ["B", "F811"]
"scripts/**" = ["B"]
