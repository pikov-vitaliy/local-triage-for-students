# Доступ к интерфейсу из локальной сети – например, из ВМ VMware на этом компьютере (ADR-0103).
# Порт публикуется ещё и на адресе этого компьютера TRIAGE_LAN_ADDR (127.0.0.1 остаётся), адрес
# добавляется к разрешённым именам хоста (TRUSTED_HOSTS). Входа по паролю в приложении нет: интерфейс увидит любой,
# кто достанет до этого адреса и порта. Файл подключает start.ps1, если в .env задан TRIAGE_LAN_ADDR:
#   .\start.ps1 -LanAddress 192.0.2.10     – включить (адрес должен быть у сетевого адаптера этого компьютера)
#   .\start.ps1 -LocalOnly                    – снова только этот компьютер
# Без TRIAGE_LAN_ADDR файл не принимается («:?»): пустой адрес опубликовал бы порт на всех адаптерах. start.ps1
# передаёт сюда тот адрес, который сам проверил (переменная окружения процесса важнее строки .env), и перед
# запуском сверяет итоговые публикации: только 127.0.0.1 и этот адрес, иначе контейнер не пересоздаётся.
services:
  triage:
    ports:
      - "${TRIAGE_LAN_ADDR:?TRIAGE_LAN_ADDR не задан}:${TRIAGE_PORT:-8765}:8765"
    environment:
      TRUSTED_HOSTS: "${TRIAGE_LAN_ADDR:?TRIAGE_LAN_ADDR не задан},${TRUSTED_HOSTS:-}"
